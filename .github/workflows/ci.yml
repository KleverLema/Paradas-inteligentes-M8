
name: CI - Paradas Inteligentes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Analisis y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar codigo con Ruff
        run: python -m ruff check src tests

      - name: Ejecutar pruebas con pytest
        run: python -m pytest tests/ -v

  contrato:
    name: Contrato OpenAPI y documentacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar herramientas
        run: npm ci

      - name: Validar OpenAPI con Spectral
        run: npx --no-install spectral lint api/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

      - name: Generar documentacion con Redocly
        run: npx --no-install redocly build-docs api/openapi.yaml --output docs-generada/index.html --inlineBundle
